name: image
on:
  push:
    branches: [main]
    paths: ['server.js', 'public/**', 'package.json', 'package-lock.json', 'deploy/Dockerfile', '.github/workflows/image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/templates-back4app/game-backend-starteratest
            ghcr.io/templates-back4app/game-backend-starter:${{ github.sha }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
